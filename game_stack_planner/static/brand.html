<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Fafnir — Logo studies</title>
  <link rel="icon" href="/fafnir-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="brand-page">
  <main class="brand-sheet">
    <header class="brand-sheet-header">
      <div>
        <p class="eyebrow">FAFNIR / IDENTITY STUDIES</p>
        <h1>Logo system</h1>
        <p>所有アセットという財宝を、必要な実装へ組み替える竜。</p>
      </div>
      <a class="button secondary" href="/">アプリへ戻る</a>
    </header>
    <section class="logo-grid" aria-label="Fafnir logo variations">
      <article class="logo-study recommended">
        <div class="logo-canvas"><img src="/fafnir-logo-rune.svg" alt="Rune Vault logo"></div>
        <div><span>RECOMMENDED</span><h2>Rune Vault</h2><p>竜・F・金庫印を一つの紋章に統合。小さいヘッダから配布物まで崩れにくい。</p></div>
      </article>
      <article class="logo-study">
        <div class="logo-canvas"><img src="/fafnir-logo-flat.svg" alt="Flat Geometry logo"></div>
        <div><span>FLAT</span><h2>Flat Geometry</h2><p>資産を表す立方体と竜を幾何学化。最もニュートラルで企業的。</p></div>
      </article>
    </section>
  </main>
</body>
</html>
